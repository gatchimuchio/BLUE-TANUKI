name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      WEBCHAT_TOKEN: ci-webchat-token-123456
      WEBCHAT_RESUME_TOKEN: ci-resume-token-123456
      BLUE_TANUKI_MAINTENANCE_TOKEN: ci-maintenance-token-123456
      BLUE_TANUKI_SETTINGS_TOKEN: ci-settings-token-123456
      LLM_BACKEND: stub
      SLACK_BOT_TOKEN: ci-slack-bot-token
      SLACK_APP_TOKEN: ci-slack-app-token
      DISCORD_BOT_TOKEN: ci-discord-bot-token
      MICROSOFT_GRAPH_ACCESS_TOKEN: ci-microsoft-graph-token
      LINE_CHANNEL_ACCESS_TOKEN: ci-line-channel-token
      ANTHROPIC_API_KEY: ci-anthropic-api-key
      GITHUB_TOKEN: ci-github-token
      BLUE_TANUKI_GITHUB_REPOS: gatchimuchio/blue-tanuki
      BLUE_TANUKI_AUDIT_DIR: .blue-tanuki/audit
      BLUE_TANUKI_SESSION_DIR: .blue-tanuki/sessions
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@v6
        with:
          node-version: "22.14.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm docs:check
      - run: pnpm validate:repo-health
      - run: pnpm validate:packaging
      - run: pnpm validate:release-hardening
      - run: pnpm validate:channels
      - run: pnpm plugin:review -- --package packages/channel-slack --bundled
      - run: pnpm validate:ga
      - run: pnpm validate:product
      - run: pnpm smoke:serve
      - run: pnpm smoke:resume
      - run: pnpm smoke:live
      - run: pnpm run doctor
      - name: Doctor fails closed without core credentials
        run: |
          set +e
          WEBCHAT_TOKEN= WEBCHAT_RESUME_TOKEN= pnpm run doctor
          status=$?
          set -e
          test "$status" -eq 2
      - run: pnpm release:bundle -- --dry-run
      - run: pnpm release:bundle
      - run: pnpm release:verify

  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t blue-tanuki:ci .

  linux-product:
    runs-on: ubuntu-latest
    needs: verify
    env:
      BLUE_TANUKI_VALIDATE_TIMEOUT_MS: "300000"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@v6
        with:
          node-version: "22.14.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: package:linux -> smoke:linux-installed product gate
        run: pnpm validate:product -- --phase P3 --evidence .codex-tmp/validate-product-linux
      - name: Upload Linux product evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validate-product-linux-evidence
          path: .codex-tmp/validate-product-linux
          if-no-files-found: ignore

  macos-product:
    runs-on: macos-latest
    needs: verify
    env:
      BLUE_TANUKI_VALIDATE_TIMEOUT_MS: "300000"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@v6
        with:
          node-version: "22.14.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: package:macos -> smoke:macos-installed product gate
        run: pnpm validate:product -- --phase P3 --evidence .codex-tmp/validate-product-macos
      - name: Upload macOS product evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validate-product-macos-evidence
          path: .codex-tmp/validate-product-macos
          if-no-files-found: ignore

  macos-intel-product:
    runs-on: macos-15-intel
    needs: verify
    env:
      BLUE_TANUKI_VALIDATE_TIMEOUT_MS: "300000"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@v6
        with:
          node-version: "22.14.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: package:macos -> smoke:macos-installed product gate (x64)
        run: pnpm validate:product -- --phase P3 --evidence .codex-tmp/validate-product-macos-intel
      - name: Upload macOS Intel product evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validate-product-macos-intel-evidence
          path: .codex-tmp/validate-product-macos-intel
          if-no-files-found: ignore

  windows-product:
    runs-on: windows-latest
    needs: verify
    env:
      BLUE_TANUKI_VALIDATE_TIMEOUT_MS: "300000"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@v6
        with:
          node-version: "22.14.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Windows core unit tests
        run: |
          pnpm --filter @blue-tanuki/protocol run test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --filter @blue-tanuki/hds-brain run test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --filter @blue-tanuki/gateway run test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --filter @blue-tanuki/core run test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: package:windows -> smoke:windows-installed product gate
        run: pnpm validate:product -- --phase P3 --evidence .codex-tmp/validate-product-windows
      - name: Upload Windows product evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validate-product-windows-evidence
          path: .codex-tmp/validate-product-windows
          if-no-files-found: ignore
