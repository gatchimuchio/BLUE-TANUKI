name: Temporary Linux isolation check
run-name: Linux isolation check on ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-linux-isolation-check
  cancel-in-progress: false

jobs:
  linux-isolation:
    name: Native Ubuntu build and focused runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out selected commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.3

      - name: Install native runtime prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap curl

      - name: Start and verify the systemd user manager
        shell: bash
        run: |
          uid="$(id -u)"
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@${uid}.service"
          runtime_dir="/run/user/${uid}"
          for attempt in {1..20}; do
            if [[ -S "$runtime_dir/bus" && -S "$runtime_dir/systemd/private" ]]; then
              break
            fi
            sleep 1
          done
          test -S "$runtime_dir/bus"
          test -S "$runtime_dir/systemd/private"
          echo "XDG_RUNTIME_DIR=$runtime_dir" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=$runtime_dir/bus" >> "$GITHUB_ENV"
          systemctl --user show-environment >/dev/null
          test "$(stat -fc %T /sys/fs/cgroup)" = cgroup2fs
          controllers="$(cat /sys/fs/cgroup/cgroup.controllers)"
          for controller in cpu memory pids; do
            grep -qw "$controller" <<< "$controllers"
          done
          test -x /usr/bin/bwrap

      - name: Diagnose delegated cgroup and bubblewrap startup
        shell: bash
        run: |
          set +e
          uid="$(id -u)"
          user_cgroup="$(systemctl --user show --property=ControlGroup --value)"
          user_cgroup_path="/sys/fs/cgroup${user_cgroup}"
          for control_file in cgroup.controllers cgroup.subtree_control; do
            if [[ -r "$user_cgroup_path/$control_file" ]]; then
              printf '%s=%s\n' "$control_file" "$(cat "$user_cgroup_path/$control_file")"
            else
              printf '%s=unavailable\n' "$control_file"
            fi
          done
          probe_unit="blue-tanuki-limit-probe-$$.service"
          systemd-run --user --pipe --wait --unit="$probe_unit" \
            --property=LimitCORE=0 --property=LimitNOFILE=128 \
            --property=LimitFSIZE=67108864 --property=MemoryMax=536870912 \
            --property=TasksMax=64 --property=CPUQuota=100% \
            --property=RuntimeMaxSec=10s -- /usr/bin/true
          printf 'systemd_resource_limit_probe_exit=%s\n' "$?"
          systemctl --user show --no-pager --property=Result \
            --property=ExecMainCode --property=ExecMainStatus "$probe_unit" 2>/dev/null
          bwrap_unit="blue-tanuki-bwrap-probe-$$.service"
          systemd-run --user --pipe --wait --unit="$bwrap_unit" \
            --property=LimitCORE=0 --property=LimitNOFILE=128 \
            --property=LimitFSIZE=67108864 --property=MemoryMax=536870912 \
            --property=TasksMax=64 --property=CPUQuota=100% \
            --property=RuntimeMaxSec=10s -- /usr/bin/bwrap \
            --unshare-user --unshare-pid --unshare-net --unshare-ipc --unshare-uts \
            --new-session --die-with-parent --disable-userns --assert-userns-disabled \
            --cap-drop ALL --ro-bind /usr /usr --symlink /usr/bin /bin \
            --symlink /usr/sbin /sbin --symlink /usr/lib /lib --symlink /usr/lib64 /lib64 \
            --proc /proc --dev /dev --size 67108864 --perms 1777 --tmpfs /tmp \
            --dir /workspace --chdir /workspace --clearenv \
            --setenv PATH /usr/bin:/bin -- /usr/bin/true
          printf 'systemd_bubblewrap_probe_exit=%s\n' "$?"
          systemctl --user show --no-pager --property=Result \
            --property=ExecMainCode --property=ExecMainStatus "$bwrap_unit" 2>/dev/null

      - name: Set up Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          rustup default 1.95.0
          rustc --version

      - name: Install locked workspace dependencies
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
          pnpm --version
          pnpm install --frozen-lockfile

      - name: Build workspace and Linux isolation helper
        run: pnpm build

      - name: Run focused Linux shell isolation tests
        run: pnpm exec vitest run packages/blue-tanuki/test/tools_builtin.test.ts --testNamePattern='shell\.exec'

      - name: Run focused doctor state tests
        run: pnpm exec vitest run apps/gateway/test/doctor.test.ts --testNamePattern='shell isolation state'
