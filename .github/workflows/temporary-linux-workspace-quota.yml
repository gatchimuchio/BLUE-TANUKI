name: Temporary Linux shell workspace verification
run-name: Linux shell workspace on ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-linux-shell-workspace
  cancel-in-progress: false

jobs:
  linux-shell-workspace:
    name: Linux build and environment-gated shell smoke
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - name: Check out selected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.3

      - name: Install native runtime prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes apparmor bubblewrap
          package_version="$(dpkg-query -W -f='${Version}' bubblewrap)"
          printf 'bubblewrap_package_version=%s\n' "$package_version"
          dpkg --compare-versions "$package_version" ge '0.11.1-1ubuntu0.2'
          if [[ -u /usr/bin/bwrap ]]; then
            echo "refusing to test with a setuid Bubblewrap binary" >&2
            exit 1
          fi
          /usr/bin/bwrap --version
          /usr/bin/bwrap --help | grep -F -- '--tmp-overlay'

      - name: Start and verify the systemd user manager
        shell: bash
        run: |
          set -euo pipefail
          uid="$(id -u)"
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@${uid}.service"
          runtime_dir="/run/user/${uid}"
          for attempt in {1..20}; do
            if [[ -S "$runtime_dir/bus" && -S "$runtime_dir/systemd/private" ]]; then break; fi
            sleep 1
          done
          test -S "$runtime_dir/bus"
          test -S "$runtime_dir/systemd/private"
          echo "XDG_RUNTIME_DIR=$runtime_dir" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=$runtime_dir/bus" >> "$GITHUB_ENV"
          systemctl --user show-environment >/dev/null
          test "$(stat -fc %T /sys/fs/cgroup)" = cgroup2fs
          controllers="$(cat /sys/fs/cgroup/cgroup.controllers)"
          for controller in cpu memory pids; do grep -qw "$controller" <<< "$controllers"; done
          test -x /usr/bin/bwrap

      - name: Probe Linux isolation prerequisites without changing runner policy
        id: bwrap
        shell: bash
        run: |
          set -euo pipefail
          restriction=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          available=false
          reason=memory_swap_controller_unavailable
          if [[ -r "$restriction" && "$(cat "$restriction")" = 1 ]]; then
            printf 'apparmor_restrict_unprivileged_userns=%s\n' "$(cat "$restriction")"
          else
            echo "apparmor_restrict_unprivileged_userns=unavailable"
          fi
          if [[ -f /sys/fs/cgroup/memory.swap.max ]]; then
            if /usr/bin/bwrap --unshare-user --ro-bind / / -- /usr/bin/true; then
              available=true
              reason=none
              echo "Bubblewrap user namespaces and memory.swap.max are available under the existing runner policy"
            else
              reason=user_namespace_mapping_unavailable
              echo "Bubblewrap user namespace mapping is unavailable; runner policy is unchanged"
            fi
          else
            echo "memory.swap.max is unavailable; Linux runtime tests will be NOT_RUN"
          fi
          printf 'available=%s\n' "$available" >> "$GITHUB_OUTPUT"
          printf 'reason=%s\n' "$reason" >> "$GITHUB_OUTPUT"

      - name: Set up Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          rustup default 1.95.0
          rustc --version

      - name: Install locked workspace dependencies
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
          pnpm --version
          pnpm install --frozen-lockfile

      - name: Build workspace and Linux isolation helper
        run: pnpm build

      - name: Verify Linux isolation diagnostic filtering
        run: cargo test --locked --offline --manifest-path packages/blue-tanuki/native/linux-isolation/Cargo.toml

      - name: Verify temporary Linux workspace isolation and file limit
        if: steps.bwrap.outputs.available == 'true'
        run: pnpm exec vitest run packages/blue-tanuki/test/tools_builtin.test.ts --testNamePattern='shell\.exec (isolates Linux workspace writes and discards them on completion|enforces the per-file size limit)'

      - name: Record unavailable Linux runtime smoke
        if: steps.bwrap.outputs.available != 'true'
        shell: bash
        env:
          RUNTIME_UNAVAILABLE_REASON: ${{ steps.bwrap.outputs.reason }}
        run: |
          printf '## Linux shell runtime smoke\n\n**NOT_RUN** — hosted runner prerequisite unavailable: `%s`. Linux runtime integration tests were not executed. The workflow did not modify runner security policy.\n' \
            "$RUNTIME_UNAVAILABLE_REASON" >> "$GITHUB_STEP_SUMMARY"

      - name: Capture transient user-service diagnostics after test failure
        if: failure()
        shell: bash
        run: |
          systemctl --user --failed --no-pager || true
          journalctl --user -b --no-pager -n 100 || true

      - name: Capture filtered AppArmor mount diagnostics after test failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          sudo journalctl -k -b --no-pager -n 400 | awk '
            /apparmor="DENIED"/ && (/operation="mount"/ || (/operation="capable"/ && /capability=21/)) {
              line = ""
              for (i = 1; i <= NF; i++) {
                if ($i ~ /^(apparmor|operation|class|info|error|profile|comm|capability|capname|requested|denied|fstype)=/) {
                  line = line (line == "" ? "" : " ") $i
                }
              }
              print line
              found = 1
            }
            END {
              if (!found) print "no filtered AppArmor mount/CAP_SYS_ADMIN denial was present in the kernel journal window"
            }
          ' | tail -n 20

      - name: Capture redacted OverlayFS kernel diagnostics after test failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          sudo journalctl -k -b --no-pager -n 800 | awk '
            /overlayfs:/ {
              line = $0
              gsub(/\/tmp\/btnk-shell-[^[:space:],]*/, "<fixture-path>", line)
              gsub(/\/workspace[^[:space:],]*/, "<workspace-path>", line)
              gsub(/lowerdir=[^ ,]*/, "lowerdir=<redacted>", line)
              gsub(/upperdir=[^ ,]*/, "upperdir=<redacted>", line)
              gsub(/workdir=[^ ,]*/, "workdir=<redacted>", line)
              print line
              found = 1
            }
            END {
              if (!found) print "no OverlayFS-specific kernel diagnostic was present in the kernel journal window"
            }
          ' | tail -n 20
