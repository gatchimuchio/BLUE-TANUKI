name: Temporary Linux workspace quota verification
run-name: Linux workspace quota on ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-linux-workspace-quota
  cancel-in-progress: false

jobs:
  linux-workspace-quota:
    name: Native Linux build and focused shell tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out selected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.3

      - name: Install native runtime prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes apparmor bubblewrap fuse-overlayfs util-linux

      - name: Prepare an ephemeral FUSE device for diagnostics
        id: fuse-device
        shell: bash
        run: |
          set -u
          created=false
          available=false
          if [[ -c /dev/fuse ]]; then
            available=true
            echo "runner_fuse_device=preexisting"
          else
            module_available=false
            if grep -Eq '^[[:space:]]*nodev[[:space:]]+fuse$' /proc/filesystems; then
              module_available=true
            elif sudo modprobe fuse >/dev/null 2>&1; then
              module_available=true
            fi
            if [[ "$module_available" = true ]]; then
              if sudo mknod /dev/fuse c 10 229; then
                created=true
                if sudo chmod 0666 /dev/fuse; then
                  available=true
                  echo "runner_fuse_device=created_for_ephemeral_probe"
                else
                  echo "runner_fuse_device_permission_setup_failed"
                  if sudo rm -f /dev/fuse; then created=false; fi
                fi
              else
                echo "runner_fuse_device_creation_unavailable"
              fi
            else
              echo "runner_fuse_filesystem_unavailable"
            fi
          fi
          echo "created=$created" >> "$GITHUB_OUTPUT"
          echo "available=$available" >> "$GITHUB_OUTPUT"

      - name: Start and verify the systemd user manager
        shell: bash
        run: |
          set -euo pipefail
          uid="$(id -u)"
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@${uid}.service"
          runtime_dir="/run/user/${uid}"
          for attempt in {1..20}; do
            if [[ -S "$runtime_dir/bus" && -S "$runtime_dir/systemd/private" ]]; then break; fi
            sleep 1
          done
          test -S "$runtime_dir/bus"
          test -S "$runtime_dir/systemd/private"
          echo "XDG_RUNTIME_DIR=$runtime_dir" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=$runtime_dir/bus" >> "$GITHUB_ENV"
          systemctl --user show-environment >/dev/null
          test "$(stat -fc %T /sys/fs/cgroup)" = cgroup2fs
          controllers="$(cat /sys/fs/cgroup/cgroup.controllers)"
          for controller in cpu memory pids; do grep -qw "$controller" <<< "$controllers"; done
          test -x /usr/bin/bwrap

      - name: Check Bubblewrap user namespaces without replacing runner policy
        id: bwrap-profile
        shell: bash
        run: |
          set -euo pipefail
          restriction=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          profile_path=/etc/apparmor.d/usr.bin.bwrap
          profiles=/sys/kernel/security/apparmor/profiles
          if [[ -r "$restriction" && "$(cat "$restriction")" = 1 ]]; then
            if [[ -e "$profile_path" ]] || sudo grep -Eq '^(/usr/bin/bwrap|usr.bin.bwrap) ' "$profiles"; then
              echo "managed=false" >> "$GITHUB_OUTPUT"
              echo "using the existing runner policy without modifying it"
              /usr/bin/bwrap --unshare-user --ro-bind / / -- /usr/bin/true
            else
              echo "managed=true" >> "$GITHUB_OUTPUT"
              sudo tee "$profile_path" >/dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          /usr/bin/bwrap flags=(default_allow) {
            userns,
          }
          PROFILE
              sudo apparmor_parser -r "$profile_path"
              sudo grep -Eq '^(/usr/bin/bwrap|usr.bin.bwrap) ' "$profiles"
              /usr/bin/bwrap --unshare-user --ro-bind / / -- /usr/bin/true
            fi
          else
            echo "managed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Diagnose OverlayFS options incrementally in a user namespace
        shell: bash
        run: |
          set -euo pipefail
          lower_source="$RUNNER_TEMP/overlay-lower"
          probe_script="$RUNNER_TEMP/overlay-probe.py"
          stderr_file="$RUNNER_TEMP/overlay-probe.stderr"
          mkdir -m 0700 "$lower_source"
          printf fixture > "$lower_source/probe"
          chmod 0444 "$lower_source/probe"
          chmod 0555 "$lower_source"
          cat > "$probe_script" <<'PY'
          import ctypes
          import errno
          import os

          libc = ctypes.CDLL(None, use_errno=True)
          libc.mount.argtypes = [ctypes.c_char_p, ctypes.c_char_p, ctypes.c_char_p, ctypes.c_ulong, ctypes.c_char_p]
          libc.renameat2.argtypes = [ctypes.c_int, ctypes.c_char_p, ctypes.c_int, ctypes.c_char_p, ctypes.c_uint]
          libc.umount.argtypes = [ctypes.c_char_p]

          def mount(source, target, filesystem, flags=0, options=None):
              result = libc.mount(
                  source.encode() if source else None,
                  target.encode(),
                  filesystem.encode() if filesystem else None,
                  flags,
                  options.encode() if options else None,
              )
              return result, ctypes.get_errno()

          def report(name, result, error):
              print(f"{name}: result={result} errno={error} {errno.errorcode.get(error, 'OK')}", flush=True)

          print(f"uid={os.getuid()} euid={os.geteuid()} gid={os.getgid()}", flush=True)
          with open('/proc/self/status', encoding='ascii') as status:
              print(next(line.strip() for line in status if line.startswith('CapEff:')), flush=True)

          result, error = mount('tmpfs', '/workspace-storage', 'tmpfs', 2 | 4, 'size=134217728,nr_inodes=100000,mode=0700')
          report('tmpfs_mount', result, error)
          if result != 0:
              raise SystemExit(0)
          os.mkdir('/workspace-storage/upper')
          os.mkdir('/workspace-storage/work')
          os.chmod('/workspace-storage/upper', 0o700)
          os.chmod('/workspace-storage/work', 0o700)

          source = b'/workspace-storage/work/.whiteout-probe'
          destination = b'/workspace-storage/work/.whiteout-probe-moved'
          fd = os.open(source, os.O_CREAT | os.O_EXCL | os.O_WRONLY, 0)
          os.close(fd)
          result = libc.renameat2(-100, source, -100, destination, 4)
          error = ctypes.get_errno()
          report('rename_whiteout', result, error)
          for path in (source, destination):
              try:
                  os.unlink(path)
              except FileNotFoundError:
                  pass
          if result != 0:
              raise SystemExit(0)

          variants = (
              ('userxattr', 'userxattr'),
              ('redirect_nofollow', 'userxattr,redirect_dir=nofollow'),
              ('metacopy_off', 'userxattr,redirect_dir=nofollow,metacopy=off'),
              ('production', 'userxattr,redirect_dir=nofollow,metacopy=off,index=off'),
          )
          for name, extra_options in variants:
              upper = f'/workspace-storage/upper-{name}'
              work = f'/workspace-storage/work-{name}'
              os.mkdir(upper, 0o700)
              os.mkdir(work, 0o700)
              options = f'lowerdir=/workspace-lower,upperdir={upper},workdir={work},{extra_options}'
              result, error = mount('overlay', '/workspace', 'overlay', 2 | 4, options)
              report(f'overlay_mount_{name}', result, error)
              if result != 0:
                  continue
              try:
                  readback = open('/workspace/probe', encoding='utf-8').read()
                  with open('/workspace/write-probe', 'w', encoding='utf-8') as output:
                      output.write('fixture-write')
                  writeback = open('/workspace/write-probe', encoding='utf-8').read()
                  os.unlink('/workspace/probe')
                  io_ok = (
                      readback == 'fixture'
                      and writeback == 'fixture-write'
                      and not os.path.exists('/workspace/probe')
                  )
                  print(f'overlay_io_{name}={"success" if io_ok else "failed"}', flush=True)
              except OSError as exc:
                  print(f'overlay_io_{name}=errno_{exc.errno}', flush=True)
              finally:
                  result = libc.umount(b'/workspace')
                  error = ctypes.get_errno()
                  report(f'overlay_unmount_{name}', result, error)
                  if result != 0:
                      raise SystemExit(2)
          PY
          chmod 0600 "$probe_script"
          set +e
          /usr/bin/bwrap \
            --unshare-user --unshare-pid --unshare-net --unshare-ipc --unshare-uts \
            --new-session --die-with-parent --cap-drop ALL \
            --cap-add CAP_SYS_ADMIN --cap-add CAP_MKNOD --cap-add CAP_SETPCAP \
            --ro-bind /usr /usr \
            --symlink usr/bin /bin --symlink usr/sbin /sbin \
            --symlink usr/lib /lib --symlink usr/lib64 /lib64 \
            --proc /proc --dev /dev --size 1073741824 --perms 1777 --tmpfs /tmp \
            --dir /workspace --dir /workspace-lower \
            --ro-bind "$lower_source" /workspace-lower \
            --dir /workspace-storage --dir /commit-target \
            --ro-bind "$probe_script" /overlay-probe.py \
            --chdir / --clearenv --setenv PATH /usr/bin:/bin \
            --setenv HOME /workspace --setenv TMPDIR /tmp --setenv LANG C.UTF-8 \
            -- /usr/bin/unshare --mount --propagation private /usr/bin/python3 /overlay-probe.py \
            >"$RUNNER_TEMP/overlay-probe.stdout" 2>"$stderr_file"
          probe_status=$?
          set -e
          if [[ -s "$RUNNER_TEMP/overlay-probe.stdout" ]]; then
            cat "$RUNNER_TEMP/overlay-probe.stdout"
          fi
          if [[ "$probe_status" != 0 ]]; then
            printf 'bubblewrap_probe_exit=%s\n' "$probe_status"
            if [[ -s "$stderr_file" ]]; then
              sed -E 's#(/home/runner/[^[:space:]]+)#<runner-path>#g' "$stderr_file"
            fi
          fi

      - name: Compare root namespace OverlayFS in a throwaway mount namespace
        shell: bash
        run: |
          set -u
          root_base="$RUNNER_TEMP/overlay-root-probe"
          root_script="$RUNNER_TEMP/overlay-root-probe.py"
          mkdir -m 0700 "$root_base"
          cat > "$root_script" <<'PY'
          import ctypes
          import errno
          import os
          import sys

          libc = ctypes.CDLL(None, use_errno=True)
          libc.mount.argtypes = [ctypes.c_char_p, ctypes.c_char_p, ctypes.c_char_p, ctypes.c_ulong, ctypes.c_char_p]
          libc.umount.argtypes = [ctypes.c_char_p]

          def mount(source, target, filesystem, flags=0, options=None):
              result = libc.mount(
                  source.encode() if source else None,
                  target.encode(),
                  filesystem.encode() if filesystem else None,
                  flags,
                  options.encode() if options else None,
              )
              return result, ctypes.get_errno()

          def report(name, result, error):
              print(f"{name}: result={result} errno={error} {errno.errorcode.get(error, 'OK')}", flush=True)

          base = sys.argv[2]
          lower_source = sys.argv[1]
          lower = os.path.join(base, 'lower')
          storage = os.path.join(base, 'storage')
          upper = os.path.join(storage, 'upper')
          work = os.path.join(storage, 'work')
          workspace = os.path.join(base, 'workspace')
          for path in (lower, storage, workspace):
              os.mkdir(path, 0o700)

          result, error = mount(lower_source, lower, None, 4096)
          report('root_lower_bind', result, error)
          if result != 0:
              raise SystemExit(0)
          result, error = mount(None, lower, None, 4096 | 32 | 1)
          report('root_lower_readonly', result, error)
          if result != 0:
              raise SystemExit(0)

          result, error = mount('tmpfs', storage, 'tmpfs', 2 | 4, 'size=134217728,nr_inodes=100000,mode=0700')
          report('root_tmpfs_mount', result, error)
          if result != 0:
              raise SystemExit(0)
          os.mkdir(upper, 0o700)
          os.mkdir(work, 0o700)

          options = f'lowerdir={lower},upperdir={upper},workdir={work},userxattr,redirect_dir=nofollow,metacopy=off,index=off'
          result, error = mount('overlay', workspace, 'overlay', 2 | 4, options)
          report('root_overlay_mount', result, error)
          if result == 0:
              print(f"root_overlay_readback={open(os.path.join(workspace, 'probe'), encoding='utf-8').read()}", flush=True)
              libc.umount(workspace.encode())
          PY
          sudo unshare --mount --propagation private /usr/bin/python3 "$root_script" "$RUNNER_TEMP/overlay-lower" "$root_base"

      - name: Probe FUSE OverlayFS in the production user namespace
        shell: bash
        run: |
          set -u
          if [[ ! -c /dev/fuse ]]; then
            echo "fuse_device_unavailable"
            exit 0
          fi
          lower_source="$RUNNER_TEMP/overlay-fuse-lower"
          probe_script="$RUNNER_TEMP/overlay-fuse-probe.sh"
          mkdir -m 0700 "$lower_source"
          printf fixture > "$lower_source/probe"
          chmod 0444 "$lower_source/probe"
          chmod 0555 "$lower_source"
          cat > "$probe_script" <<'SH'
          #!/bin/sh
          set -eu
          mkdir -p /workspace /workspace-storage
          if [ ! -c /dev/fuse ]; then
            echo "fuse_device_unavailable_in_namespace"
            exit 0
          fi
          if ! /usr/bin/python3 - <<'PY'
          import ctypes
          import errno
          libc = ctypes.CDLL(None, use_errno=True)
          result = libc.mount(b'tmpfs', b'/workspace-storage', b'tmpfs', 2 | 4, b'size=134217728,nr_inodes=100000,mode=0700')
          error = ctypes.get_errno()
          print(f'fuse_probe_tmpfs_mount: result={result} errno={error} {errno.errorcode.get(error, "OK")}', flush=True)
          raise SystemExit(result != 0)
          PY
          then
            echo "fuse_probe_storage_mount_failed"
            exit 0
          fi
          mkdir /workspace-storage/upper /workspace-storage/work
          fuse_pid=""
          cleanup() {
            fusermount3 -u /workspace 2>/dev/null || true
            if [ -n "$fuse_pid" ]; then
              kill "$fuse_pid" 2>/dev/null || true
              wait "$fuse_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          /usr/bin/fuse-overlayfs -f -o lowerdir=/workspace-lower,upperdir=/workspace-storage/upper,workdir=/workspace-storage/work /workspace >/tmp/fuse-overlayfs.log 2>&1 &
          fuse_pid=$!
          mounted=0
          for attempt in $(seq 1 40); do
            if grep -q ' /workspace ' /proc/self/mountinfo; then
              mounted=1
              break
            fi
            if ! kill -0 "$fuse_pid" 2>/dev/null; then break; fi
            sleep 0.1
          done
          if [ "$mounted" = 1 ]; then
            readback="$(cat /workspace/probe 2>/dev/null)"
            printf 'fuse_overlay_readback=%s\n' "$readback"
            if ! printf write > /workspace/created || ! rm /workspace/probe || [ -e /workspace/probe ] || [ "$(cat /workspace/created 2>/dev/null || true)" != write ]; then
              echo "fuse_overlay_write_and_whiteout=failed"
              exit 0
            fi
            echo "fuse_overlay_write_and_whiteout=success"
            exit 0
          fi
          echo "fuse_overlay_mount=failed"
          sed -E 's#(/home/runner/[^[:space:]]+)#<runner-path>#g' /tmp/fuse-overlayfs.log | head -c 1024
          kill "$fuse_pid" 2>/dev/null || true
          wait "$fuse_pid" 2>/dev/null || true
          exit 0
          SH
          chmod 0700 "$probe_script"
          if bwrap \
            --unshare-user \
            --unshare-pid \
            --unshare-net \
            --unshare-ipc \
            --unshare-uts \
            --new-session \
            --die-with-parent \
            --cap-drop ALL \
            --cap-add CAP_SYS_ADMIN \
            --cap-add CAP_MKNOD \
            --cap-add CAP_SETPCAP \
            --ro-bind /usr /usr \
            --symlink usr/bin /bin \
            --symlink usr/sbin /sbin \
            --symlink usr/lib /lib \
            --symlink usr/lib64 /lib64 \
            --proc /proc \
            --dev /dev \
            --dev-bind /dev/fuse /dev/fuse \
            --size 67108864 \
            --perms 1777 \
            --tmpfs /tmp \
            --dir /workspace \
            --dir /workspace-lower \
            --ro-bind "$lower_source" /workspace-lower \
            --dir /workspace-storage \
            --ro-bind "$probe_script" /fuse-overlay-probe.sh \
            --chdir / \
            --clearenv \
            --setenv PATH /usr/bin:/bin \
            --setenv TMPDIR /tmp \
            --setenv LANG C.UTF-8 \
            -- /usr/bin/unshare --mount --propagation private /bin/sh /fuse-overlay-probe.sh; then
            :
          else
            probe_status=$?
            echo "fuse_probe_bwrap_start_failed status=$probe_status"
          fi

      - name: Probe FUSE OverlayFS with no process capabilities
        shell: bash
        run: |
          set -u
          if [[ ! -c /dev/fuse ]]; then
            echo "fuse_device_unavailable"
            exit 0
          fi
          lower_source="$RUNNER_TEMP/overlay-no-cap-lower"
          probe_script="$RUNNER_TEMP/overlay-no-cap-probe.sh"
          mkdir -m 0700 "$lower_source"
          printf fixture > "$lower_source/probe"
          chmod 0444 "$lower_source/probe"
          chmod 0555 "$lower_source"
          cat > "$probe_script" <<'SH'
          #!/bin/sh
          set -u
          capability_value() {
            while IFS="$(printf ' \t')" read -r key value rest; do
              if [ "${key%:}" = "$1" ]; then
                printf '%s' "$value"
                return 0
              fi
            done < "$2"
            return 1
          }
          shell_caps="$(capability_value CapEff /proc/self/status)/$(capability_value CapPrm /proc/self/status)/$(capability_value CapBnd /proc/self/status)"
          no_new_privs="$(capability_value NoNewPrivs /proc/self/status)"
          printf 'fuse_probe_shell_caps=%s no_new_privs=%s\n' "$shell_caps" "$no_new_privs"
          if [ "$shell_caps" != '0000000000000000/0000000000000000/0000000000000000' ] || [ "$no_new_privs" != '1' ]; then
            echo "fuse_overlay_no_cap_precondition=failed"
            exit 0
          fi
          mkdir -p /workspace /workspace-storage/upper /workspace-storage/work
          fuse_pid=""
          cleanup() {
            fusermount3 -u /workspace 2>/dev/null || true
            if [ -n "$fuse_pid" ]; then
              kill "$fuse_pid" 2>/dev/null || true
              wait "$fuse_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          /usr/bin/fuse-overlayfs -f -o lowerdir=/workspace-lower,upperdir=/workspace-storage/upper,workdir=/workspace-storage/work /workspace >/tmp/fuse-overlayfs-no-cap.log 2>&1 &
          fuse_pid=$!
          mounted=0
          for attempt in $(seq 1 40); do
            if grep -q ' /workspace ' /proc/self/mountinfo; then
              mounted=1
              break
            fi
            if ! kill -0 "$fuse_pid" 2>/dev/null; then break; fi
            sleep 0.1
          done
          if [ "$mounted" != 1 ]; then
            failure_class=other
            while IFS= read -r line; do
              case "$line" in
                *"Operation not permitted"*) failure_class=operation_not_permitted ;;
                *"Permission denied"*) failure_class=permission_denied ;;
              esac
            done < /tmp/fuse-overlayfs-no-cap.log
            printf 'fuse_overlay_no_cap_mount=failed class=%s\n' "$failure_class"
            exit 0
          fi
          daemon_caps="$(capability_value CapEff "/proc/$fuse_pid/status")/$(capability_value CapPrm "/proc/$fuse_pid/status")/$(capability_value CapBnd "/proc/$fuse_pid/status")"
          printf 'fuse_probe_daemon_caps=%s\n' "$daemon_caps"
          printf 'fuse_overlay_readback=%s\n' "$(cat /workspace/probe 2>/dev/null || true)"
          if [ "$daemon_caps" != '0000000000000000/0000000000000000/0000000000000000' ]; then
            echo "fuse_overlay_no_cap_result=daemon_capabilities_present"
            exit 0
          fi
          if ! printf write > /workspace/created || ! rm /workspace/probe || [ -e /workspace/probe ] || [ "$(cat /workspace/created 2>/dev/null || true)" != write ]; then
            echo "fuse_overlay_no_cap_write_and_whiteout=failed"
            exit 0
          fi
          echo "fuse_overlay_no_cap_write_and_whiteout=success"
          SH
          chmod 0700 "$probe_script"
          if bwrap \
            --unshare-user \
            --unshare-pid \
            --unshare-net \
            --unshare-ipc \
            --unshare-uts \
            --new-session \
            --die-with-parent \
            --cap-drop ALL \
            --ro-bind /usr /usr \
            --symlink usr/bin /bin \
            --symlink usr/sbin /sbin \
            --symlink usr/lib /lib \
            --symlink usr/lib64 /lib64 \
            --proc /proc \
            --dev /dev \
            --dev-bind /dev/fuse /dev/fuse \
            --size 134217728 \
            --perms 0700 \
            --tmpfs /workspace-storage \
            --tmpfs /tmp \
            --dir /workspace \
            --dir /workspace-lower \
            --ro-bind "$lower_source" /workspace-lower \
            --ro-bind "$probe_script" /fuse-overlay-no-cap-probe.sh \
            --chdir / \
            --clearenv \
            --setenv PATH /usr/bin:/bin \
            --setenv TMPDIR /tmp \
            --setenv LANG C.UTF-8 \
            -- /usr/bin/setpriv --no-new-privs /bin/sh /fuse-overlay-no-cap-probe.sh; then
            :
          else
            probe_status=$?
            echo "fuse_probe_no_cap_bwrap_start_failed status=$probe_status"
          fi

      - name: Set up Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          rustup default 1.95.0
          rustc --version

      - name: Install locked workspace dependencies
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
          pnpm --version
          pnpm install --frozen-lockfile

      - name: Build workspace and Linux isolation helper
        run: pnpm build

      - name: Verify Linux isolation diagnostic filtering
        run: cargo test --locked --offline --manifest-path packages/blue-tanuki/native/linux-isolation/Cargo.toml

      - name: Verify Linux shell workspace and aggregate quotas
        run: pnpm exec vitest run packages/blue-tanuki/test/tools_builtin.test.ts --testNamePattern='shell\.exec (uses Linux namespaces and writes only inside its dedicated root|enforces the per-file size limit|bounds aggregate workspace writes and commits only the sandbox view)'

      - name: Capture transient user-service diagnostics after test failure
        if: failure()
        shell: bash
        run: |
          systemctl --user --failed --no-pager || true
          journalctl --user -b --no-pager -n 100 || true

      - name: Capture filtered AppArmor mount diagnostics after test failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          sudo journalctl -k -b --no-pager -n 400 | awk '
            /apparmor="DENIED"/ && (/operation="mount"/ || (/operation="capable"/ && /capability=21/)) {
              line = ""
              for (i = 1; i <= NF; i++) {
                if ($i ~ /^(apparmor|operation|class|info|error|profile|comm|capability|capname|requested|denied|fstype)=/) {
                  line = line (line == "" ? "" : " ") $i
                }
              }
              print line
              found = 1
            }
            END {
              if (!found) print "no filtered AppArmor mount/CAP_SYS_ADMIN denial was present in the kernel journal window"
            }
          ' | tail -n 20

      - name: Capture redacted OverlayFS kernel diagnostics after test failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          sudo journalctl -k -b --no-pager -n 800 | awk '
            /overlayfs:/ {
              line = $0
              gsub(/\/tmp\/btnk-shell-[^[:space:],]*/, "<fixture-path>", line)
              gsub(/\/workspace[^[:space:],]*/, "<workspace-path>", line)
              gsub(/lowerdir=[^ ,]*/, "lowerdir=<redacted>", line)
              gsub(/upperdir=[^ ,]*/, "upperdir=<redacted>", line)
              gsub(/workdir=[^ ,]*/, "workdir=<redacted>", line)
              print line
              found = 1
            }
            END {
              if (!found) print "no OverlayFS-specific kernel diagnostic was present in the kernel journal window"
            }
          ' | tail -n 20

      - name: Remove and verify temporary Bubblewrap AppArmor profile
        if: always()
        shell: bash
        env:
          PROFILE_MANAGED: ${{ steps.bwrap-profile.outputs.managed }}
        run: |
          set -euo pipefail
          if [[ "${PROFILE_MANAGED:-false}" = true ]]; then
            profile_path=/etc/apparmor.d/usr.bin.bwrap
            profiles=/sys/kernel/security/apparmor/profiles
            if sudo grep -Eq '^(/usr/bin/bwrap|usr.bin.bwrap) ' "$profiles"; then
              sudo apparmor_parser -R "$profile_path"
            fi
            for attempt in {1..20}; do
              if ! sudo grep -Eq '^(/usr/bin/bwrap|usr.bin.bwrap) ' "$profiles"; then break; fi
              sleep 0.25
            done
            if sudo grep -Eq '^(/usr/bin/bwrap|usr.bin.bwrap) ' "$profiles"; then
              echo "temporary Bubblewrap AppArmor profile is still loaded" >&2
              exit 1
            fi
            if [[ -e "$profile_path" ]]; then sudo rm "$profile_path"; fi
            test ! -e "$profile_path"
          fi

      - name: Remove the temporary runner FUSE device
        if: always()
        shell: bash
        env:
          FUSE_DEVICE_CREATED: ${{ steps.fuse-device.outputs.created }}
        run: |
          set -euo pipefail
          if [[ "${FUSE_DEVICE_CREATED:-false}" = true ]]; then
            if [[ -c /dev/fuse ]]; then sudo rm /dev/fuse; fi
            test ! -e /dev/fuse
          fi
