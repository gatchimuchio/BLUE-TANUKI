name: Temporary Linux workspace quota verification
run-name: Linux workspace quota on ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-linux-workspace-quota
  cancel-in-progress: false

jobs:
  linux-workspace-quota:
    name: Native Linux build and focused shell tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out selected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.3

      - name: Install native runtime prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes apparmor bubblewrap fuse3 fuse-overlayfs util-linux

      - name: Prepare an ephemeral FUSE device for diagnostics
        id: fuse-device
        shell: bash
        run: |
          set -u
          created=false
          available=false
          if [[ -c /dev/fuse ]]; then
            available=true
            echo "runner_fuse_device=preexisting"
          else
            module_available=false
            if grep -Eq '^[[:space:]]*nodev[[:space:]]+fuse$' /proc/filesystems; then
              module_available=true
            elif sudo modprobe fuse >/dev/null 2>&1; then
              module_available=true
            fi
            if [[ "$module_available" = true ]]; then
              if sudo mknod /dev/fuse c 10 229; then
                created=true
                if sudo chmod 0666 /dev/fuse; then
                  available=true
                  echo "runner_fuse_device=created_for_ephemeral_probe"
                else
                  echo "runner_fuse_device_permission_setup_failed"
                  if sudo rm -f /dev/fuse; then created=false; fi
                fi
              else
                echo "runner_fuse_device_creation_unavailable"
              fi
            else
              echo "runner_fuse_filesystem_unavailable"
            fi
          fi
          echo "created=$created" >> "$GITHUB_OUTPUT"
          echo "available=$available" >> "$GITHUB_OUTPUT"

      - name: Start and verify the systemd user manager
        shell: bash
        run: |
          set -euo pipefail
          uid="$(id -u)"
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@${uid}.service"
          runtime_dir="/run/user/${uid}"
          for attempt in {1..20}; do
            if [[ -S "$runtime_dir/bus" && -S "$runtime_dir/systemd/private" ]]; then break; fi
            sleep 1
          done
          test -S "$runtime_dir/bus"
          test -S "$runtime_dir/systemd/private"
          echo "XDG_RUNTIME_DIR=$runtime_dir" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=$runtime_dir/bus" >> "$GITHUB_ENV"
          systemctl --user show-environment >/dev/null
          test "$(stat -fc %T /sys/fs/cgroup)" = cgroup2fs
          controllers="$(cat /sys/fs/cgroup/cgroup.controllers)"
          for controller in cpu memory pids; do grep -qw "$controller" <<< "$controllers"; done
          test -x /usr/bin/bwrap

      - name: Check Bubblewrap user namespaces without replacing runner policy
        id: bwrap-profile
        shell: bash
        run: |
          set -euo pipefail
          restriction=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          profile_path=/etc/apparmor.d/usr.bin.bwrap
          profiles=/sys/kernel/security/apparmor/profiles
          if [[ -r "$restriction" && "$(cat "$restriction")" = 1 ]]; then
            if [[ -e "$profile_path" ]] || sudo grep -Eq '^(/usr/bin/bwrap|usr.bin.bwrap) ' "$profiles"; then
              echo "managed=false" >> "$GITHUB_OUTPUT"
              echo "using the existing runner policy without modifying it"
              /usr/bin/bwrap --unshare-user --ro-bind / / -- /usr/bin/true
            else
              echo "managed=true" >> "$GITHUB_OUTPUT"
              sudo tee "$profile_path" >/dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          /usr/bin/bwrap flags=(default_allow) {
            userns,
          }
          PROFILE
              sudo apparmor_parser -r "$profile_path"
              sudo grep -Eq '^(/usr/bin/bwrap|usr.bin.bwrap) ' "$profiles"
              /usr/bin/bwrap --unshare-user --ro-bind / / -- /usr/bin/true
            fi
          else
            echo "managed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Diagnose OverlayFS options incrementally in a user namespace
        shell: bash
        run: |
          set -euo pipefail
          lower_source="$RUNNER_TEMP/overlay-lower"
          probe_script="$RUNNER_TEMP/overlay-probe.py"
          stderr_file="$RUNNER_TEMP/overlay-probe.stderr"
          mkdir -m 0700 "$lower_source"
          printf fixture > "$lower_source/probe"
          chmod 0444 "$lower_source/probe"
          chmod 0555 "$lower_source"
          cat > "$probe_script" <<'PY'
          import ctypes
          import errno
          import os

          libc = ctypes.CDLL(None, use_errno=True)
          libc.mount.argtypes = [ctypes.c_char_p, ctypes.c_char_p, ctypes.c_char_p, ctypes.c_ulong, ctypes.c_char_p]
          libc.renameat2.argtypes = [ctypes.c_int, ctypes.c_char_p, ctypes.c_int, ctypes.c_char_p, ctypes.c_uint]
          libc.umount.argtypes = [ctypes.c_char_p]

          def mount(source, target, filesystem, flags=0, options=None):
              result = libc.mount(
                  source.encode() if source else None,
                  target.encode(),
                  filesystem.encode() if filesystem else None,
                  flags,
                  options.encode() if options else None,
              )
              return result, ctypes.get_errno()

          def report(name, result, error):
              print(f"{name}: result={result} errno={error} {errno.errorcode.get(error, 'OK')}", flush=True)

          print(f"uid={os.getuid()} euid={os.geteuid()} gid={os.getgid()}", flush=True)
          with open('/proc/self/status', encoding='ascii') as status:
              print(next(line.strip() for line in status if line.startswith('CapEff:')), flush=True)

          result, error = mount('tmpfs', '/workspace-storage', 'tmpfs', 2 | 4, 'size=134217728,nr_inodes=100000,mode=0700')
          report('tmpfs_mount', result, error)
          if result != 0:
              raise SystemExit(0)
          os.mkdir('/workspace-storage/upper')
          os.mkdir('/workspace-storage/work')
          os.chmod('/workspace-storage/upper', 0o700)
          os.chmod('/workspace-storage/work', 0o700)

          source = b'/workspace-storage/work/.whiteout-probe'
          destination = b'/workspace-storage/work/.whiteout-probe-moved'
          fd = os.open(source, os.O_CREAT | os.O_EXCL | os.O_WRONLY, 0)
          os.close(fd)
          result = libc.renameat2(-100, source, -100, destination, 4)
          error = ctypes.get_errno()
          report('rename_whiteout', result, error)
          for path in (source, destination):
              try:
                  os.unlink(path)
              except FileNotFoundError:
                  pass
          if result != 0:
              raise SystemExit(0)

          variants = (
              ('userxattr', 'userxattr'),
              ('redirect_nofollow', 'userxattr,redirect_dir=nofollow'),
              ('metacopy_off', 'userxattr,redirect_dir=nofollow,metacopy=off'),
              ('production', 'userxattr,redirect_dir=nofollow,metacopy=off,index=off'),
          )
          for name, extra_options in variants:
              upper = f'/workspace-storage/upper-{name}'
              work = f'/workspace-storage/work-{name}'
              os.mkdir(upper, 0o700)
              os.mkdir(work, 0o700)
              options = f'lowerdir=/workspace-lower,upperdir={upper},workdir={work},{extra_options}'
              result, error = mount('overlay', '/workspace', 'overlay', 2 | 4, options)
              report(f'overlay_mount_{name}', result, error)
              if result != 0:
                  continue
              try:
                  readback = open('/workspace/probe', encoding='utf-8').read()
                  with open('/workspace/write-probe', 'w', encoding='utf-8') as output:
                      output.write('fixture-write')
                  writeback = open('/workspace/write-probe', encoding='utf-8').read()
                  os.unlink('/workspace/probe')
                  io_ok = (
                      readback == 'fixture'
                      and writeback == 'fixture-write'
                      and not os.path.exists('/workspace/probe')
                  )
                  print(f'overlay_io_{name}={"success" if io_ok else "failed"}', flush=True)
              except OSError as exc:
                  print(f'overlay_io_{name}=errno_{exc.errno}', flush=True)
              finally:
                  result = libc.umount(b'/workspace')
                  error = ctypes.get_errno()
                  report(f'overlay_unmount_{name}', result, error)
                  if result != 0:
                      raise SystemExit(2)
          PY
          chmod 0600 "$probe_script"
          set +e
          /usr/bin/bwrap \
            --unshare-user --unshare-pid --unshare-net --unshare-ipc --unshare-uts \
            --new-session --die-with-parent --cap-drop ALL \
            --cap-add CAP_SYS_ADMIN --cap-add CAP_MKNOD --cap-add CAP_SETPCAP \
            --ro-bind /usr /usr \
            --symlink usr/bin /bin --symlink usr/sbin /sbin \
            --symlink usr/lib /lib --symlink usr/lib64 /lib64 \
            --proc /proc --dev /dev --size 1073741824 --perms 1777 --tmpfs /tmp \
            --dir /workspace --dir /workspace-lower \
            --ro-bind "$lower_source" /workspace-lower \
            --dir /workspace-storage --dir /commit-target \
            --ro-bind "$probe_script" /overlay-probe.py \
            --chdir / --clearenv --setenv PATH /usr/bin:/bin \
            --setenv HOME /workspace --setenv TMPDIR /tmp --setenv LANG C.UTF-8 \
            -- /usr/bin/unshare --mount --propagation private /usr/bin/python3 /overlay-probe.py \
            >"$RUNNER_TEMP/overlay-probe.stdout" 2>"$stderr_file"
          probe_status=$?
          set -e
          if [[ -s "$RUNNER_TEMP/overlay-probe.stdout" ]]; then
            cat "$RUNNER_TEMP/overlay-probe.stdout"
          fi
          if [[ "$probe_status" != 0 ]]; then
            printf 'bubblewrap_probe_exit=%s\n' "$probe_status"
            if [[ -s "$stderr_file" ]]; then
              sed -E 's#(/home/runner/[^[:space:]]+)#<runner-path>#g' "$stderr_file"
            fi
          fi

      - name: Compare root namespace OverlayFS in a throwaway mount namespace
        shell: bash
        run: |
          set -u
          root_base="$RUNNER_TEMP/overlay-root-probe"
          root_script="$RUNNER_TEMP/overlay-root-probe.py"
          mkdir -m 0700 "$root_base"
          cat > "$root_script" <<'PY'
          import ctypes
          import errno
          import os
          import sys

          libc = ctypes.CDLL(None, use_errno=True)
          libc.mount.argtypes = [ctypes.c_char_p, ctypes.c_char_p, ctypes.c_char_p, ctypes.c_ulong, ctypes.c_char_p]
          libc.umount.argtypes = [ctypes.c_char_p]

          def mount(source, target, filesystem, flags=0, options=None):
              result = libc.mount(
                  source.encode() if source else None,
                  target.encode(),
                  filesystem.encode() if filesystem else None,
                  flags,
                  options.encode() if options else None,
              )
              return result, ctypes.get_errno()

          def report(name, result, error):
              print(f"{name}: result={result} errno={error} {errno.errorcode.get(error, 'OK')}", flush=True)

          base = sys.argv[2]
          lower_source = sys.argv[1]
          lower = os.path.join(base, 'lower')
          storage = os.path.join(base, 'storage')
          upper = os.path.join(storage, 'upper')
          work = os.path.join(storage, 'work')
          workspace = os.path.join(base, 'workspace')
          for path in (lower, storage, workspace):
              os.mkdir(path, 0o700)

          result, error = mount(lower_source, lower, None, 4096)
          report('root_lower_bind', result, error)
          if result != 0:
              raise SystemExit(0)
          result, error = mount(None, lower, None, 4096 | 32 | 1)
          report('root_lower_readonly', result, error)
          if result != 0:
              raise SystemExit(0)

          result, error = mount('tmpfs', storage, 'tmpfs', 2 | 4, 'size=134217728,nr_inodes=100000,mode=0700')
          report('root_tmpfs_mount', result, error)
          if result != 0:
              raise SystemExit(0)
          os.mkdir(upper, 0o700)
          os.mkdir(work, 0o700)

          options = f'lowerdir={lower},upperdir={upper},workdir={work},userxattr,redirect_dir=nofollow,metacopy=off,index=off'
          result, error = mount('overlay', workspace, 'overlay', 2 | 4, options)
          report('root_overlay_mount', result, error)
          if result == 0:
              print(f"root_overlay_readback={open(os.path.join(workspace, 'probe'), encoding='utf-8').read()}", flush=True)
              libc.umount(workspace.encode())
          PY
          sudo unshare --mount --propagation private /usr/bin/python3 "$root_script" "$RUNNER_TEMP/overlay-lower" "$root_base"

      - name: Probe FUSE OverlayFS in the production user namespace
        shell: bash
        run: |
          set -u
          if [[ ! -c /dev/fuse ]]; then
            echo "fuse_device_unavailable"
            exit 0
          fi
          lower_source="$RUNNER_TEMP/overlay-fuse-lower"
          probe_script="$RUNNER_TEMP/overlay-fuse-probe.sh"
          mkdir -m 0700 "$lower_source"
          printf fixture > "$lower_source/probe"
          chmod 0444 "$lower_source/probe"
          chmod 0555 "$lower_source"
          cat > "$probe_script" <<'SH'
          #!/bin/sh
          set -eu
          capability_value() {
            key="$1"
            file="$2"
            while read -r label value rest; do
              if [ "$label" = "$key:" ]; then
                printf '%s' "$value"
                return 0
              fi
            done < "$file"
            return 1
          }
          mkdir -p /workspace /workspace-storage
          if [ ! -c /dev/fuse ]; then
            echo "fuse_device_unavailable_in_namespace"
            exit 0
          fi
          if ! /usr/bin/python3 - <<'PY'
          import ctypes
          import errno
          libc = ctypes.CDLL(None, use_errno=True)
          result = libc.mount(b'tmpfs', b'/workspace-storage', b'tmpfs', 2 | 4, b'size=134217728,nr_inodes=100000,mode=0700')
          error = ctypes.get_errno()
          print(f'fuse_probe_tmpfs_mount: result={result} errno={error} {errno.errorcode.get(error, "OK")}', flush=True)
          raise SystemExit(result != 0)
          PY
          then
            echo "fuse_probe_storage_mount_failed"
            exit 0
          fi
          mkdir /workspace-storage/upper /workspace-storage/work
          fuse_pid=""
          mount_helper_pid=""
          cleanup() {
            fusermount3 -u /workspace 2>/dev/null || true
            if [ -n "$fuse_pid" ]; then
              kill "$fuse_pid" 2>/dev/null || true
              wait "$fuse_pid" 2>/dev/null || true
            fi
            if [ -n "$mount_helper_pid" ]; then
              kill "$mount_helper_pid" 2>/dev/null || true
              wait "$mount_helper_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          mount_helper=/usr/sbin/mount.fuse3
          if [ ! -x "$mount_helper" ]; then
            echo "fuse_mount_helper_unavailable"
            exit 0
          fi
          "$mount_helper" /usr/bin/fuse-overlayfs# /workspace \
            -o drop_privileges,lowerdir=/workspace-lower,upperdir=/workspace-storage/upper,workdir=/workspace-storage/work \
            >/tmp/fuse-overlayfs.log 2>&1 &
          mount_helper_pid=$!
          mounted=0
          for attempt in $(seq 1 40); do
            if grep -q ' /workspace ' /proc/self/mountinfo; then
              mounted=1
              break
            fi
            sleep 0.1
          done
          if [ "$mounted" = 1 ]; then
            for attempt in $(seq 1 40); do
              for process in /proc/[0-9]*; do
                if IFS= read -r process_name < "$process/comm" 2>/dev/null && [ "$process_name" = fuse-overlayfs ]; then
                  fuse_pid="${process#/proc/}"
                  break 2
                fi
              done
              sleep 0.1
            done
            if [ -z "$fuse_pid" ]; then
              echo "fuse_overlay_daemon_state=unavailable"
              exit 0
            fi
            if [ ! -r "/proc/$fuse_pid/status" ]; then
              echo "fuse_overlay_daemon_state=unavailable"
              exit 0
            fi
            daemon_caps="$(capability_value CapEff "/proc/$fuse_pid/status")/$(capability_value CapPrm "/proc/$fuse_pid/status")/$(capability_value CapBnd "/proc/$fuse_pid/status")"
            daemon_nnp="$(capability_value NoNewPrivs "/proc/$fuse_pid/status")"
            printf 'fuse_overlay_daemon_caps=%s no_new_privs=%s\n' "$daemon_caps" "$daemon_nnp"
            if [ "$daemon_caps" != '0000000000000000/0000000000000000/0000000000000000' ] || [ "$daemon_nnp" != 1 ]; then
              echo "fuse_overlay_daemon_privilege_drop=failed"
              exit 0
            fi
            echo "fuse_overlay_daemon_privilege_drop=success"
            cat > /tmp/fuse-overlay-capless-workload.sh <<'WORKLOAD'
          #!/bin/sh
          set -eu
          capability_value() {
            key="$1"
            while read -r label value rest; do
              if [ "$label" = "$key:" ]; then
                printf '%s' "$value"
                return 0
              fi
            done < /proc/self/status
            return 1
          }
          shell_caps="$(capability_value CapEff)/$(capability_value CapPrm)/$(capability_value CapBnd)"
          shell_nnp="$(capability_value NoNewPrivs)"
          printf 'fuse_overlay_shell_caps=%s no_new_privs=%s\n' "$shell_caps" "$shell_nnp"
          if [ "$shell_caps" != '0000000000000000/0000000000000000/0000000000000000' ] || [ "$shell_nnp" != 1 ]; then
            echo "fuse_overlay_shell_privilege_boundary=failed"
            exit 1
          fi
          if [ "$(cat /workspace/probe 2>/dev/null || true)" != fixture ]; then
            echo "fuse_overlay_shell_read=failed"
            exit 1
          fi
          if ! printf write > /workspace/created || ! rm /workspace/probe || [ -e /workspace/probe ] || [ "$(cat /workspace/created 2>/dev/null || true)" != write ]; then
            echo "fuse_overlay_shell_write_whiteout=failed"
            exit 1
          fi
          echo "fuse_overlay_shell_read_write_whiteout=success"
          WORKLOAD
            cat > /tmp/fuse-overlay-drop-caps-exec.py <<'PY'
          import ctypes
          import os
          import platform
          import sys

          PR_CAPBSET_DROP = 24
          PR_CAP_AMBIENT = 47
          PR_CAP_AMBIENT_CLEAR_ALL = 4
          PR_SET_DUMPABLE = 4
          CAP_SYS_ADMIN = 21
          CAP_MKNOD = 27
          CAP_SETPCAP = 8

          def fail(code):
              print(f"fuse_nested_bwrap_capability_drop={code}", flush=True)
              raise SystemExit(125)

          class Header(ctypes.Structure):
              _fields_ = [("version", ctypes.c_uint), ("pid", ctypes.c_int)]

          class Data(ctypes.Structure):
              _fields_ = [
                  ("effective", ctypes.c_uint),
                  ("permitted", ctypes.c_uint),
                  ("inheritable", ctypes.c_uint),
              ]

          machine = platform.machine().lower()
          capset_syscall = {"x86_64": 126, "aarch64": 91}.get(machine)
          if capset_syscall is None or len(sys.argv) < 2:
              fail("unsupported_invocation")

          libc = ctypes.CDLL(None, use_errno=True)
          libc.prctl.argtypes = [ctypes.c_int, ctypes.c_ulong, ctypes.c_ulong, ctypes.c_ulong, ctypes.c_ulong]
          libc.prctl.restype = ctypes.c_int
          libc.syscall.restype = ctypes.c_long

          for capability in (CAP_SYS_ADMIN, CAP_MKNOD, CAP_SETPCAP):
              if libc.prctl(PR_CAPBSET_DROP, capability, 0, 0, 0) != 0:
                  fail(f"bounding_errno_{ctypes.get_errno()}")
          if libc.prctl(PR_CAP_AMBIENT, PR_CAP_AMBIENT_CLEAR_ALL, 0, 0, 0) != 0:
              fail(f"ambient_errno_{ctypes.get_errno()}")

          header = Header(0x20080522, 0)
          data = (Data * 2)()
          if libc.syscall(ctypes.c_long(capset_syscall), ctypes.byref(header), ctypes.byref(data)) != 0:
              fail(f"capset_errno_{ctypes.get_errno()}")
          if libc.prctl(PR_SET_DUMPABLE, 0, 0, 0, 0) != 0:
              fail(f"dumpable_errno_{ctypes.get_errno()}")

          status = {}
          with open("/proc/self/status", encoding="ascii") as stream:
              for line in stream:
                  key, separator, value = line.partition(":")
                  if separator and key in {"CapEff", "CapPrm", "CapInh", "CapBnd", "CapAmb"}:
                      status[key] = int(value.strip(), 16)
          if set(status) != {"CapEff", "CapPrm", "CapInh", "CapBnd", "CapAmb"} or any(status.values()):
              fail("mask_verification_failed")

          print("fuse_nested_bwrap_capability_drop=success", flush=True)
          os.execv(sys.argv[1], sys.argv[1:])
          PY
            chmod 0500 /tmp/fuse-overlay-capless-workload.sh
            chmod 0500 /tmp/fuse-overlay-drop-caps-exec.py
            if /usr/bin/python3 /tmp/fuse-overlay-drop-caps-exec.py /usr/bin/bwrap \
              --unshare-user --unshare-pid --unshare-net --unshare-ipc --unshare-uts \
              --new-session --die-with-parent --disable-userns --cap-drop ALL \
              --ro-bind /usr /usr \
              --symlink usr/bin /bin --symlink usr/sbin /sbin \
              --symlink usr/lib /lib --symlink usr/lib64 /lib64 \
              --proc /proc --dev /dev \
              --ro-bind /tmp/fuse-overlay-capless-workload.sh /capless-workload.sh \
              --size 67108864 --perms 1777 --tmpfs /tmp \
              --dir /workspace --bind /workspace /workspace \
              --chdir / --clearenv --setenv PATH /usr/bin:/bin --setenv LANG C.UTF-8 \
              -- /usr/bin/setpriv --no-new-privs /bin/sh /capless-workload.sh; then
              echo "fuse_overlay_capless_shell=success"
            else
              workload_status=$?
              echo "fuse_overlay_capless_shell=failed status=$workload_status"
            fi
            exit 0
          fi
          echo "fuse_overlay_mount=failed"
          sed -E 's#(/home/runner/[^[:space:]]+)#<runner-path>#g' /tmp/fuse-overlayfs.log | head -c 1024
          kill "$fuse_pid" 2>/dev/null || true
          wait "$fuse_pid" 2>/dev/null || true
          exit 0
          SH
          chmod 0700 "$probe_script"
          if bwrap \
            --unshare-user \
            --unshare-pid \
            --unshare-net \
            --unshare-ipc \
            --unshare-uts \
            --new-session \
            --die-with-parent \
            --cap-drop ALL \
            --cap-add CAP_SYS_ADMIN \
            --cap-add CAP_SETPCAP \
            --ro-bind /usr /usr \
            --symlink usr/bin /bin \
            --symlink usr/sbin /sbin \
            --symlink usr/lib /lib \
            --symlink usr/lib64 /lib64 \
            --proc /proc \
            --dev /dev \
            --dev-bind /dev/fuse /dev/fuse \
            --size 67108864 \
            --perms 1777 \
            --tmpfs /tmp \
            --dir /workspace \
            --dir /workspace-lower \
            --ro-bind "$lower_source" /workspace-lower \
            --dir /workspace-storage \
            --ro-bind "$probe_script" /fuse-overlay-probe.sh \
            --chdir / \
            --clearenv \
            --setenv PATH /usr/bin:/bin \
            --setenv TMPDIR /tmp \
            --setenv LANG C.UTF-8 \
            -- /usr/bin/unshare --mount --propagation private /bin/sh /fuse-overlay-probe.sh; then
            :
          else
            probe_status=$?
            echo "fuse_probe_bwrap_start_failed status=$probe_status"
          fi

      - name: Probe isolated FUSE mount propagation and commit target masking
        shell: bash
        run: |
          set -euo pipefail
          lower_source="$(mktemp -d "$RUNNER_TEMP/blue-tanuki-fuse-lower.XXXXXX")"
          commit_source="$(mktemp -d "$RUNNER_TEMP/blue-tanuki-fuse-target.XXXXXX")"
          probe_root="$(mktemp -d "$RUNNER_TEMP/blue-tanuki-fuse-boundary.XXXXXX")"
          cleanup() {
            for path in "$lower_source" "$commit_source" "$probe_root"; do
              case "$path" in
                "$RUNNER_TEMP"/blue-tanuki-fuse-lower.*|"$RUNNER_TEMP"/blue-tanuki-fuse-target.*|"$RUNNER_TEMP"/blue-tanuki-fuse-boundary.*)
                  rm -rf -- "$path"
                  ;;
                *)
                  echo "fuse_boundary_cleanup=path_check_failed"
                  return 1
                  ;;
              esac
            done
          }
          trap cleanup EXIT

          printf fixture > "$lower_source/probe"
          printf immutable-sentinel > "$commit_source/sentinel"
          chmod 0644 "$commit_source/sentinel"
          target_digest_before="$(sha256sum "$commit_source/sentinel" | cut -d ' ' -f1)"
          target_metadata_before="$(stat -c '%d:%i:%f:%u:%g:%h:%s:%Y:%Z' "$commit_source" "$commit_source/sentinel")"
          target_entries_before="$(find "$commit_source" -mindepth 1 -maxdepth 1 -printf '%y:%f\n' | LC_ALL=C sort)"

          cat > "$probe_root/outer.sh" <<'OUTER'
          #!/bin/bash
          set -euo pipefail
          if awk '$5 == "/" { for (i = 7; i <= NF && $i != "-"; i++) if ($i ~ /^shared:[0-9]+$/) found = 1 } END { exit !found }' /proc/self/mountinfo; then
            if ! mount --make-rprivate / 2>/dev/null; then
              echo "fuse_boundary_root_private=failed"
              exit 1
            fi
          fi
          if awk '$5 == "/" { for (i = 7; i <= NF && $i != "-"; i++) if ($i ~ /^shared:[0-9]+$/) found = 1 } END { exit !found }' /proc/self/mountinfo; then
            echo "fuse_boundary_root_mount_private=failed"
            exit 1
          fi
          echo "fuse_boundary_root_mount_private=success"
          if ! mkdir -p /workspace-shared/view /tmp/fuse-boundary-storage/isolation-upper /tmp/fuse-boundary-storage/isolation-work; then
            echo "fuse_boundary_directories=failed"
            exit 1
          fi
          chmod 0700 /tmp/fuse-boundary-storage /tmp/fuse-boundary-storage/isolation-upper /tmp/fuse-boundary-storage/isolation-work
          tmp_mount_type="$(python3 - <<'PY'
          mount_type = 'missing'
          with open('/proc/self/mountinfo', encoding='ascii') as stream:
              for line in stream:
                  fields = line.split()
                  try:
                      separator = fields.index('-')
                  except ValueError:
                      continue
                  if fields[4] == '/tmp':
                      mount_type = 'tmpfs' if fields[separator + 1] == 'tmpfs' else 'other'
                      break
          print(mount_type)
          PY
          )"
          echo "fuse_boundary_tmp_mount_type=$tmp_mount_type"
          if [ "$tmp_mount_type" != tmpfs ]; then
            echo "fuse_boundary_storage_tmpfs=failed"
            exit 1
          fi
          if ! python3 - <<'PY'
          found = False
          with open('/proc/self/mountinfo', encoding='ascii') as stream:
              for line in stream:
                  fields = line.split()
                  try:
                      separator = fields.index('-')
                  except ValueError:
                      continue
                  if fields[4] == '/workspace-shared' and fields[separator + 1] == 'tmpfs':
                      found = True
                      break
          raise SystemExit(0 if found else 1)
          PY
          then
            echo "fuse_boundary_shared_tmpfs=failed"
            exit 1
          fi
          if ! mount --make-shared /workspace-shared 2>/dev/null; then
            echo "fuse_boundary_shared_mark=failed"
            exit 1
          fi
          if ! awk '$5 == "/workspace-shared" { for (i = 7; i <= NF; i++) if ($i ~ /^shared:/) shared = 1 } END { exit !shared }' /proc/self/mountinfo; then
            echo "fuse_boundary_parent_mount_shared=failed"
            exit 1
          fi
          if awk '$5 == "/" { for (i = 7; i <= NF; i++) if ($i ~ /^shared:/) shared = 1 } END { exit !shared }' /proc/self/mountinfo; then
            echo "fuse_boundary_root_mount_private=failed"
            exit 1
          fi

          child_pid=""
          cleanup_child() {
            if [ -n "$child_pid" ] && kill -0 "$child_pid" 2>/dev/null; then
              : > /tmp/fuse-boundary-stop
              for attempt in $(seq 1 50); do
                if ! kill -0 "$child_pid" 2>/dev/null; then
                  break
                fi
                sleep 0.1
              done
              if kill -0 "$child_pid" 2>/dev/null; then
                kill -TERM -- "-$child_pid" 2>/dev/null || true
                kill -KILL -- "-$child_pid" 2>/dev/null || true
              fi
              wait "$child_pid" 2>/dev/null || true
            fi
          }
          trap cleanup_child EXIT

          /usr/bin/setsid /usr/bin/unshare --mount --pid --fork --propagation unchanged /bin/bash /fuse-boundary-child.sh >/tmp/fuse-boundary-child.log 2>&1 &
          child_pid=$!
          ready=0
          for attempt in $(seq 1 100); do
            if [ -f /tmp/fuse-boundary-ready ]; then
              ready=1
              break
            fi
            if ! kill -0 "$child_pid" 2>/dev/null; then
              break
            fi
            sleep 0.1
          done
          if [ "$ready" != 1 ]; then
            echo "fuse_boundary_child_setup=failed"
            grep -E '^fuse_boundary_[a-z0-9_]+=[a-z0-9_-]+$' /tmp/fuse-boundary-child.log | tail -n 8 || true
            if grep -Eiq 'Operation not permitted|Permission denied' /tmp/fuse-boundary-child.log; then
              echo "fuse_boundary_child_error=permission_denied"
            elif grep -Eiq 'No such file or directory' /tmp/fuse-boundary-child.log; then
              echo "fuse_boundary_child_error=missing_path"
            else
              echo "fuse_boundary_child_error=other"
            fi
            exit 1
          fi

          if ! python3 - <<'PY'
          import sys
          found = False
          with open('/proc/self/mountinfo', encoding='ascii') as stream:
              for line in stream:
                  fields = line.split()
                  try:
                      separator = fields.index('-')
                  except ValueError:
                      continue
                  if len(fields) > separator + 1 and fields[4] == '/workspace-shared/view' and fields[separator + 1].startswith('fuse') and any(value.startswith('shared:') for value in fields[6:separator]):
                      found = True
          if not found:
              print('fuse_boundary_mount_propagation=failed', flush=True)
              raise SystemExit(1)
          print('fuse_boundary_mount_propagation=success', flush=True)
          PY
          then
            exit 1
          fi

          if [ "$(cat /workspace-shared/view/probe 2>/dev/null || true)" != fixture ]; then
            echo "fuse_boundary_parent_read=failed"
            exit 1
          fi
          if ! printf write > /workspace-shared/view/created || ! rm /workspace-shared/view/probe || [ -e /workspace-shared/view/probe ] || [ "$(cat /workspace-shared/view/created 2>/dev/null || true)" != write ]; then
            echo "fuse_boundary_parent_write_whiteout=failed"
            exit 1
          fi
          if [ "$(cat /commit-target/sentinel 2>/dev/null || true)" != immutable-sentinel ]; then
            echo "fuse_boundary_parent_target_changed=failed"
            exit 1
          fi
          echo "fuse_boundary_parent_read_write_whiteout=success"

          : > /tmp/fuse-boundary-stop
          if ! wait "$child_pid"; then
            echo "fuse_boundary_child_cleanup=failed"
            child_pid=""
            exit 1
          fi
          child_pid=""
          if python3 - <<'PY'
          found = False
          with open('/proc/self/mountinfo', encoding='ascii') as stream:
              for line in stream:
                  fields = line.split()
                  try:
                      separator = fields.index('-')
                  except ValueError:
                      continue
                  if len(fields) > separator + 1 and fields[4] == '/workspace-shared/view' and fields[separator + 1].startswith('fuse'):
                      found = True
          raise SystemExit(1 if found else 0)
          PY
          then
            echo "fuse_boundary_mount_cleanup=failed"
            exit 1
          fi
          echo "fuse_boundary_child_cleanup=success"
          trap - EXIT
          OUTER

          cat > "$probe_root/child.sh" <<'CHILD'
          #!/bin/bash
          set -euo pipefail
          if ! mount -t proc proc /proc 2>/dev/null; then
            echo "fuse_boundary_child_proc=failed"
            exit 1
          fi
          if ! mount -t tmpfs -o size=1048576,nr_inodes=64,mode=0755,nodev,nosuid,noexec tmpfs /commit-target 2>/dev/null; then
            echo "fuse_boundary_child_target_mask=failed"
            exit 1
          fi
          printf masked-only > /commit-target/sentinel
          chmod 0644 /commit-target/sentinel
          mount_helper_pid=""
          /usr/sbin/mount.fuse3 /usr/bin/fuse-overlayfs# /workspace-shared/view \
            -o drop_privileges,lowerdir=/workspace-lower,upperdir=/tmp/fuse-boundary-storage/isolation-upper,workdir=/tmp/fuse-boundary-storage/isolation-work \
            >/tmp/fuse-boundary-mount.log 2>&1 &
          mount_helper_pid=$!
          cleanup_child_ns() {
            umount /workspace-shared/view 2>/dev/null || true
            if [ -n "$mount_helper_pid" ]; then
              wait "$mount_helper_pid" 2>/dev/null || true
            fi
          }
          trap cleanup_child_ns EXIT
          fuse_mounted=0
          for attempt in $(seq 1 100); do
            if python3 - <<'PY'
          found = False
          with open('/proc/self/mountinfo', encoding='ascii') as stream:
              for line in stream:
                  fields = line.split()
                  try:
                      separator = fields.index('-')
                  except ValueError:
                      continue
                  if len(fields) > separator + 1 and fields[4] == '/workspace-shared/view' and fields[separator + 1].startswith('fuse'):
                      found = True
          raise SystemExit(0 if found else 1)
          PY
            then
              fuse_mounted=1
              break
            fi
            sleep 0.1
          done
          if [ "$fuse_mounted" != 1 ]; then
            echo "fuse_boundary_child_mount=failed"
            exit 1
          fi

          fuse_pid=""
          for attempt in $(seq 1 100); do
            for process in /proc/[0-9]*; do
              if IFS= read -r process_name < "$process/comm" 2>/dev/null && [ "$process_name" = fuse-overlayfs ]; then
                fuse_pid="${process#/proc/}"
                break 2
              fi
            done
            sleep 0.1
          done
          if [ -z "$fuse_pid" ]; then
            echo "fuse_boundary_daemon_state=unavailable"
            exit 1
          fi
          FUSE_PID="$fuse_pid" python3 - <<'PY'
          import os

          pid = os.environ['FUSE_PID']
          status = {}
          with open(f'/proc/{pid}/status', encoding='ascii') as stream:
              for line in stream:
                  key, separator, value = line.partition(':')
                  if separator:
                      status[key] = value.strip()
          required = {'CapEff': '0000000000000000', 'CapPrm': '0000000000000000', 'CapBnd': '0000000000000000', 'NoNewPrivs': '1'}
          if any(status.get(key) != value for key, value in required.items()):
              print('fuse_boundary_daemon_privilege_drop=failed', flush=True)
              raise SystemExit(1)
          if os.readlink(f'/proc/{pid}/ns/mnt') != os.readlink('/proc/self/ns/mnt') or os.readlink(f'/proc/{pid}/ns/pid') != os.readlink('/proc/self/ns/pid'):
              print('fuse_boundary_daemon_namespace=failed', flush=True)
              raise SystemExit(1)
          with open(f'/proc/{pid}/mountinfo', encoding='ascii') as stream:
              target_is_tmpfs = any(
                  fields[4] == '/commit-target' and fields[fields.index('-') + 1] == 'tmpfs'
                  for line in stream
                  if (fields := line.split()) and '-' in fields
              )
          try:
              with open(f'/proc/{pid}/root/commit-target/sentinel', encoding='ascii') as stream:
                  masked_target = stream.read() == 'masked-only'
          except OSError:
              masked_target = False
          if not target_is_tmpfs or not masked_target:
              print('fuse_boundary_daemon_target_view=failed', flush=True)
              raise SystemExit(1)
          print('fuse_boundary_daemon_privilege_namespace_target=success', flush=True)
          PY
          : > /tmp/fuse-boundary-ready
          while [ ! -f /tmp/fuse-boundary-stop ]; do
            sleep 0.1
          done
          umount /workspace-shared/view
          wait "$mount_helper_pid" 2>/dev/null || true
          trap - EXIT
          CHILD
          chmod 0700 "$probe_root/outer.sh" "$probe_root/child.sh"

          bwrap_status=0
          bwrap \
            --unshare-user --unshare-pid --unshare-net --unshare-ipc --unshare-uts \
            --new-session --die-with-parent --cap-drop ALL --cap-add CAP_SYS_ADMIN --cap-add CAP_SETPCAP \
            --ro-bind /usr /usr \
            --symlink usr/bin /bin --symlink usr/sbin /sbin --symlink usr/lib /lib --symlink usr/lib64 /lib64 \
            --proc /proc --dev /dev --dev-bind /dev/fuse /dev/fuse \
            --size 134217728 --perms 1777 --tmpfs /tmp \
            --dir /workspace-lower --ro-bind "$lower_source" /workspace-lower \
            --size 134217728 --tmpfs /workspace-shared --dir /commit-target \
            --bind "$commit_source" /commit-target \
            --ro-bind "$probe_root/outer.sh" /fuse-boundary-outer.sh \
            --ro-bind "$probe_root/child.sh" /fuse-boundary-child.sh \
            --chdir / --clearenv --setenv PATH /usr/bin:/bin --setenv LANG C.UTF-8 \
            -- /bin/bash /fuse-boundary-outer.sh >"$probe_root/bwrap.log" 2>&1 || bwrap_status=$?
          if [ "$bwrap_status" -ne 0 ]; then
            echo "fuse_boundary_namespace_probe=failed"
            grep -E '^fuse_boundary_[a-z0-9_]+=[a-z0-9_-]+$' "$probe_root/bwrap.log" | tail -n 8 || true
            echo "fuse_boundary_bwrap_exit=$bwrap_status"
            if grep -Eiq 'Operation not permitted|Permission denied' "$probe_root/bwrap.log"; then
              echo "fuse_boundary_bwrap_error=permission_denied"
            elif grep -Eiq 'No such file or directory' "$probe_root/bwrap.log"; then
              echo "fuse_boundary_bwrap_error=missing_path"
            elif grep -Eiq 'invalid (option|argument)|unknown option' "$probe_root/bwrap.log"; then
              echo "fuse_boundary_bwrap_error=invalid_argument"
            else
              echo "fuse_boundary_bwrap_error=other"
            fi
            exit 1
          fi

          target_digest_after="$(sha256sum "$commit_source/sentinel" | cut -d ' ' -f1)"
          target_metadata_after="$(stat -c '%d:%i:%f:%u:%g:%h:%s:%Y:%Z' "$commit_source" "$commit_source/sentinel")"
          target_entries_after="$(find "$commit_source" -mindepth 1 -maxdepth 1 -printf '%y:%f\n' | LC_ALL=C sort)"
          if [ "$target_digest_before" != "$target_digest_after" ] || [ "$target_metadata_before" != "$target_metadata_after" ] || [ "$target_entries_before" != "$target_entries_after" ]; then
            echo "fuse_boundary_host_target_integrity=failed"
            exit 1
          fi
          echo "fuse_boundary_host_target_integrity=success"
          echo "fuse_boundary_probe=success"

      - name: Probe FUSE OverlayFS with no process capabilities
        shell: bash
        run: |
          set -u
          if [[ ! -c /dev/fuse ]]; then
            echo "fuse_device_unavailable"
            exit 0
          fi
          lower_source="$RUNNER_TEMP/overlay-no-cap-lower"
          probe_script="$RUNNER_TEMP/overlay-no-cap-probe.sh"
          mkdir -m 0700 "$lower_source"
          printf fixture > "$lower_source/probe"
          chmod 0444 "$lower_source/probe"
          chmod 0555 "$lower_source"
          cat > "$probe_script" <<'SH'
          #!/bin/sh
          set -u
          capability_value() {
            while IFS="$(printf ' \t')" read -r key value rest; do
              if [ "${key%:}" = "$1" ]; then
                printf '%s' "$value"
                return 0
              fi
            done < "$2"
            return 1
          }
          shell_caps="$(capability_value CapEff /proc/self/status)/$(capability_value CapPrm /proc/self/status)/$(capability_value CapBnd /proc/self/status)"
          no_new_privs="$(capability_value NoNewPrivs /proc/self/status)"
          printf 'fuse_probe_shell_caps=%s no_new_privs=%s\n' "$shell_caps" "$no_new_privs"
          if [ "$shell_caps" != '0000000000000000/0000000000000000/0000000000000000' ] || [ "$no_new_privs" != '1' ]; then
            echo "fuse_overlay_no_cap_precondition=failed"
            exit 0
          fi
          mkdir -p /workspace /workspace-storage/upper /workspace-storage/work
          fuse_pid=""
          cleanup() {
            fusermount3 -u /workspace 2>/dev/null || true
            if [ -n "$fuse_pid" ]; then
              kill "$fuse_pid" 2>/dev/null || true
              wait "$fuse_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          /usr/bin/fuse-overlayfs -f -o lowerdir=/workspace-lower,upperdir=/workspace-storage/upper,workdir=/workspace-storage/work /workspace >/tmp/fuse-overlayfs-no-cap.log 2>&1 &
          fuse_pid=$!
          mounted=0
          for attempt in $(seq 1 40); do
            if grep -q ' /workspace ' /proc/self/mountinfo; then
              mounted=1
              break
            fi
            if ! kill -0 "$fuse_pid" 2>/dev/null; then break; fi
            sleep 0.1
          done
          if [ "$mounted" != 1 ]; then
            failure_class=other
            while IFS= read -r line; do
              case "$line" in
                *"Operation not permitted"*) failure_class=operation_not_permitted ;;
                *"Permission denied"*) failure_class=permission_denied ;;
              esac
            done < /tmp/fuse-overlayfs-no-cap.log
            printf 'fuse_overlay_no_cap_mount=failed class=%s\n' "$failure_class"
            exit 0
          fi
          daemon_caps="$(capability_value CapEff "/proc/$fuse_pid/status")/$(capability_value CapPrm "/proc/$fuse_pid/status")/$(capability_value CapBnd "/proc/$fuse_pid/status")"
          printf 'fuse_probe_daemon_caps=%s\n' "$daemon_caps"
          printf 'fuse_overlay_readback=%s\n' "$(cat /workspace/probe 2>/dev/null || true)"
          if [ "$daemon_caps" != '0000000000000000/0000000000000000/0000000000000000' ]; then
            echo "fuse_overlay_no_cap_result=daemon_capabilities_present"
            exit 0
          fi
          if ! printf write > /workspace/created || ! rm /workspace/probe || [ -e /workspace/probe ] || [ "$(cat /workspace/created 2>/dev/null || true)" != write ]; then
            echo "fuse_overlay_no_cap_write_and_whiteout=failed"
            exit 0
          fi
          echo "fuse_overlay_no_cap_write_and_whiteout=success"
          SH
          chmod 0700 "$probe_script"
          if bwrap \
            --unshare-user \
            --unshare-pid \
            --unshare-net \
            --unshare-ipc \
            --unshare-uts \
            --new-session \
            --die-with-parent \
            --cap-drop ALL \
            --ro-bind /usr /usr \
            --symlink usr/bin /bin \
            --symlink usr/sbin /sbin \
            --symlink usr/lib /lib \
            --symlink usr/lib64 /lib64 \
            --proc /proc \
            --dev /dev \
            --dev-bind /dev/fuse /dev/fuse \
            --size 134217728 \
            --perms 0700 \
            --tmpfs /workspace-storage \
            --tmpfs /tmp \
            --dir /workspace \
            --dir /workspace-lower \
            --ro-bind "$lower_source" /workspace-lower \
            --ro-bind "$probe_script" /fuse-overlay-no-cap-probe.sh \
            --chdir / \
            --clearenv \
            --setenv PATH /usr/bin:/bin \
            --setenv TMPDIR /tmp \
            --setenv LANG C.UTF-8 \
            -- /usr/bin/setpriv --no-new-privs /bin/sh /fuse-overlay-no-cap-probe.sh; then
            :
          else
            probe_status=$?
            echo "fuse_probe_no_cap_bwrap_start_failed status=$probe_status"
          fi

      - name: Set up Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          rustup default 1.95.0
          rustc --version

      - name: Install locked workspace dependencies
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
          pnpm --version
          pnpm install --frozen-lockfile

      - name: Build workspace and Linux isolation helper
        run: pnpm build

      - name: Verify Linux isolation diagnostic filtering
        run: cargo test --locked --offline --manifest-path packages/blue-tanuki/native/linux-isolation/Cargo.toml

      - name: Verify Linux shell workspace and aggregate quotas
        run: pnpm exec vitest run packages/blue-tanuki/test/tools_builtin.test.ts --testNamePattern='shell\.exec (uses Linux namespaces and writes only inside its dedicated root|enforces the per-file size limit|bounds aggregate workspace writes and commits only the sandbox view)'

      - name: Capture transient user-service diagnostics after test failure
        if: failure()
        shell: bash
        run: |
          systemctl --user --failed --no-pager || true
          journalctl --user -b --no-pager -n 100 || true

      - name: Capture filtered AppArmor mount diagnostics after test failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          sudo journalctl -k -b --no-pager -n 400 | awk '
            /apparmor="DENIED"/ && (/operation="mount"/ || (/operation="capable"/ && /capability=21/)) {
              line = ""
              for (i = 1; i <= NF; i++) {
                if ($i ~ /^(apparmor|operation|class|info|error|profile|comm|capability|capname|requested|denied|fstype)=/) {
                  line = line (line == "" ? "" : " ") $i
                }
              }
              print line
              found = 1
            }
            END {
              if (!found) print "no filtered AppArmor mount/CAP_SYS_ADMIN denial was present in the kernel journal window"
            }
          ' | tail -n 20

      - name: Capture redacted OverlayFS kernel diagnostics after test failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          sudo journalctl -k -b --no-pager -n 800 | awk '
            /overlayfs:/ {
              line = $0
              gsub(/\/tmp\/btnk-shell-[^[:space:],]*/, "<fixture-path>", line)
              gsub(/\/workspace[^[:space:],]*/, "<workspace-path>", line)
              gsub(/lowerdir=[^ ,]*/, "lowerdir=<redacted>", line)
              gsub(/upperdir=[^ ,]*/, "upperdir=<redacted>", line)
              gsub(/workdir=[^ ,]*/, "workdir=<redacted>", line)
              print line
              found = 1
            }
            END {
              if (!found) print "no OverlayFS-specific kernel diagnostic was present in the kernel journal window"
            }
          ' | tail -n 20

      - name: Remove and verify temporary Bubblewrap AppArmor profile
        if: always()
        shell: bash
        env:
          PROFILE_MANAGED: ${{ steps.bwrap-profile.outputs.managed }}
        run: |
          set -euo pipefail
          if [[ "${PROFILE_MANAGED:-false}" = true ]]; then
            profile_path=/etc/apparmor.d/usr.bin.bwrap
            profiles=/sys/kernel/security/apparmor/profiles
            if sudo grep -Eq '^(/usr/bin/bwrap|usr.bin.bwrap) ' "$profiles"; then
              sudo apparmor_parser -R "$profile_path"
            fi
            for attempt in {1..20}; do
              if ! sudo grep -Eq '^(/usr/bin/bwrap|usr.bin.bwrap) ' "$profiles"; then break; fi
              sleep 0.25
            done
            if sudo grep -Eq '^(/usr/bin/bwrap|usr.bin.bwrap) ' "$profiles"; then
              echo "temporary Bubblewrap AppArmor profile is still loaded" >&2
              exit 1
            fi
            if [[ -e "$profile_path" ]]; then sudo rm "$profile_path"; fi
            test ! -e "$profile_path"
          fi

      - name: Remove the temporary runner FUSE device
        if: always()
        shell: bash
        env:
          FUSE_DEVICE_CREATED: ${{ steps.fuse-device.outputs.created }}
        run: |
          set -euo pipefail
          if [[ "${FUSE_DEVICE_CREATED:-false}" = true ]]; then
            if [[ -c /dev/fuse ]]; then sudo rm /dev/fuse; fi
            test ! -e /dev/fuse
          fi
