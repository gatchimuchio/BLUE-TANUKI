name: Windows installed package BUILD smoke
run-name: Windows installed package BUILD smoke on ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installed-package-build-smoke
  cancel-in-progress: false

jobs:
  windows-installed-package-build-smoke:
    name: Build and exercise the installed Windows entrypoint
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Check out the selected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require the selected ref to be main or the isolated IExpress verification branch
        shell: pwsh
        env:
          BLUE_TANUKI_ACTION_REF: ${{ github.ref }}
          BLUE_TANUKI_ACTION_SHA: ${{ github.sha }}
        run: |
          $allowedRefs = @(
            "refs/heads/main",
            "refs/heads/codex/windows-iexpress-direct-smoke-20261114"
          )
          if ($allowedRefs -notcontains $env:BLUE_TANUKI_ACTION_REF) {
            throw "This BUILD smoke accepts main or the bounded IExpress verification branch only."
          }
          $actualSha = (git rev-parse HEAD).Trim()
          if ($actualSha -ne $env:BLUE_TANUKI_ACTION_SHA) {
            throw "Checked out SHA does not match the selected Actions commit."
          }
          $os = Get-CimInstance Win32_OperatingSystem -ErrorAction Stop
          Write-Output "source_sha=$actualSha"
          Write-Output "windows_caption=$($os.Caption)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.3

      - name: Install locked workspace dependencies
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
          pnpm --version
          pnpm install --frozen-lockfile

      - name: Build workspace
        shell: pwsh
        run: pnpm build

      - name: Build and verify Windows package
        shell: pwsh
        run: |
          pnpm package:windows
          pnpm package:windows:verify

      - name: Run isolated single-file installer startup smoke
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "package.json version is missing for the Windows installed smoke."
          }
          $installer = Join-Path $PWD "release/windows/BlueTanukiSetup-$version-windows-x64.exe"
          $payload = Join-Path $PWD "release/windows/blue-tanuki-$version-windows-x64-installer.zip"
          pnpm exec tsx scripts/smoke_windows_installed.ts --iexpress-exe $installer --artifact $payload --startup-only --launch-iexpress
