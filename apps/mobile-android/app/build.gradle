plugins {
    id "com.android.application"
}

android {
    namespace "com.bluetanuki.mobile"
    compileSdk 37

    defaultConfig {
        applicationId "com.bluetanuki.mobile"
        minSdk 23
        targetSdk 37
        versionCode 1
        versionName "0.1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

}

dependencies {
    testImplementation "junit:junit:4.13.2"
}
